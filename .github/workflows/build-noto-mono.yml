name: noto-mono

on:
  schedule:
    - cron: "8 5 * * *"        # Daily — rebuilds only if noto-mono's upstream changed
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if upstream is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      action: noto-mono
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: inherit
